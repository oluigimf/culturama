<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa Culturama</title>
</head>
<body>
    <header>
        <h1>Pesquisa Online</h1>

    </header>
    <section>
        <form action="" method="get">
            <fieldset>
                <legend>Dados Pessoais</legend>

                <label for="name">Nome: </label>
                <input id="name" type="text" name="userName" required>
                <br>
                <label for="age">Idade: </label>
                <input id="age" type="number" name="userAge" required min="12" max="100">
                <br>
                <label for="birthDate">Data de nascimento: </label>
                <input id="birthDate" type="date" name="userBirthDate">
                <br>
                <label for="email">Email: </label>
                <input id="email" type="email" name="userEmail" required>
                <br>
                <label for="phoneNumber">Telefone: </label>
                <input id="phoneNumber" type="tel" name="userPhoneNumber" pattern="[0-9]{11}" placeholder="12123456789">
                <br>
                <label for="image">Upload de foto: </label>
                <input id="image" type="file" accept="image/*" name="userImage">
            </fieldset>

            <fieldset>
                <legend>Perfil:</legend>
                <p>Gênero</p>
                <input id="genderF" type="radio" name="userGender" value="feminino">
                <label for="genderf">Feminino</label>
                <input id="genderM" type="radio" name="userGender" value="masculino">
                <label for="genderM">Masculino</label>
                <input id="genderNao" type="radio" name="userGender" value="naoInformado">
                <label for="genderNao">Prefiro não informar</label>
                <br>
                <label for="maritalStatus">Estado civil:</label>

                <select name="maritalStatus" id="">
                    <option value="naoInformado"selected>Selecione...</option>
                    <option value="casado">Casado</option>
                    <option value="solteiro">Solteiro</option>
                    <option value="divorciado">Divorciado</option>
                    <option value="viuvo">Viúvo</option>
                    <option value="uniaoEstavel">União Estavel</option>
                </select>
                <br>
                <label for="userState">Estado</label>
                <select name="userState" id="" required>
                    <option value="acre">Acre</option>
                    <option value="alagoas">Alagoas</option>
                    <option value="amapa">Amapá</option>
                    <option value="amazonas">Amazonas</option>
                    <option value="bahia">Bahia</option>
                    <option value="ceara">Ceará</option>
                    <option value="distritoFederal">Distrito Federal</option>
                    <option value="espiritoSanto">Espírito Santo</option>
                    <option value="goias">Goiás</option>
                    <option value="maranhao">Maranhão```html
                    <option value="acre">Acre</option>
                    <option value="alagoas">Alagoas</option>
                    <option value="amapa">Amapá</option>
                    <option value="amazonas">Amazonas</option>
                    <option value="bahia">Bahia</option>
                    <option value="ceara">Ceará</option>
                    <option value="distritoFederal">Distrito Federal</option>
                    <option value="espiritoSanto">Espírito Santo</option>
                    <option value="goias">Goiás</option>
                    <option value="maranhao">Maranhão</option>
                    <option value="matoGrosso">Mato Grosso</option>
                    <option value="matoGrossoDoSul">Mato Grosso do Sul</option>
                    <option value="minasGerais">Minas Gerais</option>
                    <option value="para">Pará</option>
                    <option value="paraiba">Paraíba</option>
                    <option value="parana">Paraná</option>
                    <option value="pernambuco">Pernambuco</option>
                    <option value="piaui">Piauí</option>
                    <option value="rioDeJaneiro">Rio de Janeiro</option>
                    <option value="rioGrandeDoNorte">Rio Grande do Norte</option>
                    <option value="rioGrandeDoSul">Rio Grande do Sul</option>
                    <option value="rondonia">Rondônia</option>
                    <option value="roraima">Roraima</option>
                    <option value="santaCatarina">Santa Catarina</option>
                    <option value="saoPaulo">São Paulo</option>
                    <option value="sergipe">Sergipe</option>
                    <option value="tocantins">Tocantins</option>
                </select>
                <br>
                <label for="userCity">Cidade: </label>
                <input type="text" name="userCity">

            </fieldset> 

            <fieldset>
                <legend>Hábitos:</legend>
                
                <p>Redes Sociais:</p>
                <input id="facebook" type="checkbox" name="social" value="facebook">
                <label for="facebook">Facebook</label>
                <br>
                <input id="instagram" type="checkbox" name="social" value="instagram">
                <label for="instagram">Instagram</label>
                <br>
                <input id="linkedin" type="checkbox" name="social" value="linkedin">
                <label for="linkedin">Linkedin</label>
                <br>
                <input id="x" type="checkbox" name="social" value="x">
                <label for="x">X</label>
                <br>
                <label for="musicalStyle">Estilo musical:</label>
                <input id="musicalStyle" name="useMusicalStyle" type="text" list="styleType">
                <datalist id="styleType">
                    <option value="Rock">Rock</option>
                    <option value="Pop">Pop</option>
                    <option value="Sertanejo">Sertanejo</option>
                    <option value="Funk">Funk</option>

                </datalist>
                <br>
                <label for="favoriteColor">Cor favorita:</label>
                <input id="favoriteColor" name="useFavoriteColor" type="color">
                <br>
                
            </fieldset>
            <br>
            <fieldset>
                <legend>Comentários</legend>
                <p>O que você acha da qualidade do nosso serviço?</p>
                <br>
                <input id="feedbackOtimo" type="radio" name="userFeedback" value="otimo">
                <label for="feedbackOtimo">Ótimo!</label>
                <br>
                <input id="feedbackBom" type="radio" name="userFeedback" value="bom">
                <label for="feedbackBom">Bom</label>
                <br>
                <input id="feedbackNeutro" type="radio" name="userFeedback" value="neutro">
                <label for="feedbackNeutro">Neutro</label>
                <br>
                <input id="feedbackRuim" type="radio" name="userFeedback" value="ruim">
                <label for="feedbackRuim">Ruim</label>
                <br>
                <input id="feedbackPessimo" type="radio" name="userFeedback" value="pessimo">
                <label for="feedbackPessimo">Péssimo!</label>
                <br>
                <p>Deixe sua opinião mais detalhada no campo abaixo:</p>
                <textarea name="mensagem" rows="6" cols="50" placeholder="Digite seu texto aqui..."></textarea>

            </fieldset>
            <br>
            <fieldset>
                <legend>Confirmações</legend>
                <input id="lgpdTerm" type="checkbox" name="userLgpdTerm" value="accepted" required>
                <label for="lgpdTerm">Eu aceito participar da pesquisa</label>
                <br>
                <input id="result" type="checkbox" name="userResult" value="accepted" required>
                <label for="result">Eu desejo receber os resultados da pesquisa por e-mail</label>

            </fieldset>

            <br>
            <button type="submit">Enviar</button>
            <button type="reset">Limpar</button>

        </form>
    </section>


</body>
</html>
